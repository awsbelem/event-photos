[project]
name = "event-photos"
version = "0.1.0"
description = "Photo delivery for community events: cull, develop, frame, review, publish"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.118",
    "imagehash>=4.3.2",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "rawpy>=0.27.1",
    "segno>=1.6.6",
]

[project.scripts]
event-photos = "event_photos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_photos"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
